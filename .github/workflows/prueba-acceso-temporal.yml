name: prueba de acceso
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prueba-acceso-temporal.yml
permissions: {}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: comprobar lectura
        env:
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          def get(path):
              request=Request('https://api.github.com'+path, headers={
                  'Authorization':'Bearer '+os.environ['PROFILE_READ_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'User-Agent':'profile-access-check'})
              with urlopen(request, timeout=30) as response:
                  return json.load(response)
          try:
              if not os.environ.get('PROFILE_READ_TOKEN'):
                  raise ValueError('missing token')
              if get('/user').get('login','').lower() != 'martinai100':
                  raise ValueError('wrong account')
              repos=[]
              for page in range(1,1001):
                  chunk=get('/user/repos?affiliation=owner,collaborator,organization_member&visibility=all&per_page=100&page='+str(page))
                  if not isinstance(chunk,list): raise ValueError('unexpected response')
                  repos.extend(chunk)
                  if len(chunk)<100: break
              else: raise ValueError('pagination limit')
              public=next((r for r in repos if r['owner']['login'].lower()=='martinai100' and not r['private'] and r.get('default_branch')),None)
              if public is None: raise ValueError('no owned public repository')
              get('/repos/'+public['full_name']+'/commits/'+quote(public['default_branch'],safe=''))
              print('Acceso de lectura inicial comprobado')
          except Exception as error:
              print('Comprobación detenida: '+type(error).__name__,file=sys.stderr)
              sys.exit(1)
          PY
